services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-busfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-busfood}
      POSTGRES_DB: ${POSTGRES_DB:-busfood}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-busfood}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-busfood}:${POSTGRES_PASSWORD:-busfood}@db:5432/${POSTGRES_DB:-busfood}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/code

volumes:
  pgdata:
